# Render Blueprint for the FastAPI backend and the static frontend (which rewrites /api to the backend).
services:
  - type: web
    name: boundless-boston-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_MODE
        value: live
      # shortcut: free-plan disk is wiped on each deploy/restart, so the cache starts cold; add a Render disk if warm cache matters.
      - key: CACHE_DB
        value: /tmp/public-cache.sqlite3
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MBTA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false

  # Frontend: Vite build served from Render's CDN. Rewrites keep /api same-origin, so the browser never needs CORS.
  - type: web
    name: boundless-boston-web
    runtime: static
    buildCommand: npm install -g pnpm@10.34.9 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://boundless-boston-api-5ze8.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
