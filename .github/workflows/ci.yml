name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q
        working-directory: backend

  e2e:
    name: Demo walkthrough (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Render
    # Render has no GitHub access to this repo, so CI rings its deploy hooks once every check passes on main
    needs: [frontend, backend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
    steps:
      - name: Trigger Render deploys
        run: |
          if [ -z "$WEB_HOOK" ] || [ -z "$API_HOOK" ]; then echo "::warning::Render deploy hook secrets are not set; skipping deploy"; exit 0; fi
          # ref pins the deploy to the commit these checks passed on, not whatever is newest on main
          curl -fsS --retry 3 --max-time 30 -X POST "$API_HOOK&ref=$GITHUB_SHA" > /dev/null
          curl -fsS --retry 3 --max-time 30 -X POST "$WEB_HOOK&ref=$GITHUB_SHA" > /dev/null
